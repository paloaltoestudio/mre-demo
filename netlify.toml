# Netlify configuration for MRE Appointment Demo

[build]
  # Build command
  command = "npm run build"
  
  # Publish directory
  publish = "dist"
  
  # Build environment variables (these should be set in Netlify dashboard)
  # VITE_DEMO_MODE
  # VITE_API_URL
  # VITE_AUTH_REDIRECT_URL
  # VITE_MAPS_API_KEY

# SPA redirect rules (also configured in public/_redirects)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

